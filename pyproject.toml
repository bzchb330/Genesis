[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seqgrasp"
version = "0.1.0"
description = "Sequential multi-object dexterous grasping research scaffold"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=1.4", "statsmodels>=0.14", "PyYAML>=6", "mujoco>=3,<4", "gymnasium>=0.29", "imageio[ffmpeg]>=2.31", "matplotlib>=3.7", "mediapy>=1.2", "reportlab>=4"]

[project.optional-dependencies]
train = ["stable-baselines3>=2.3", "tensorboard>=2.14"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["seqgrasp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
