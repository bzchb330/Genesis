experiment_id: phase2R_palmar_vs_fingertip_formal
output_dir: outputs/phase2R

state:
  seed: 20260819
  fingertip_target: 150
  palmar_target: 150
  minimum_palmar_states: 100
  maximum_states_per_group: 500
  maximum_palmar_attempts: 30000
  maximum_workers: 8
  fixture_close_steps: 400
  fixture_contact_steps: 100
  stable_hold_steps: 500
  palm_contact_fraction_minimum: 0.80
  load_bearing_force_threshold_N: 0.20
  minimum_palmar_load_bearing_fingers: 1
  maximum_palmar_load_bearing_fingers: 2
  minimum_fingertip_contact_fingers: 2
  maximum_penetration_m: 0.003
  maximum_translation_drift_m: 0.005
  maximum_orientation_drift_rad: 0.20
  # Search-only proposal ranges in the compiled palm frame. Validity still uses
  # the pre-existing Phase 2 palm-region measurement box.
  palm_tangent_y_bounds_m: [-0.035, 0.035]
  palm_tangent_z_bounds_m: [-0.070, -0.010]
  palm_surface_offset_bounds_m: [0.000, 0.003]
  active_closure_scale_bounds: [0.75, 1.10]
  active_joint_perturbation_rad: 0.08
  # Four of every five candidates concentrate on stable contact basins found by
  # the endpoint-state pilot; every fifth candidate preserves broad exploration.
  focused_candidate_stride: 5
  focused_palm_tangent_y_bounds_m: [-0.025, 0.025]
  focused_palm_tangent_z_bounds_m: [-0.035, -0.008]
  focused_closure_scale_bounds: [0.88, 0.95]
  focused_joint_perturbation_rad: 0.03
  focused_retaining_finger_subsets:
    - [middle, thumb]
    - [ring, thumb]
    - [middle]
    - [thumb]
    - [ring, middle]
  focused_proposal_profile_paths:
    - configs/grasps/resource_grasp_A_01.yaml
    - configs/grasps/resource_grasp_A_03.yaml
  retaining_finger_subsets:
    - [ring]
    - [middle]
    - [index]
    - [thumb]
    - [ring, middle]
    - [middle, thumb]
    - [ring, thumb]
  proposal_profile_paths:
    - configs/grasps/resource_grasp_A_01.yaml
    - configs/grasps/resource_grasp_A_02.yaml
    - configs/grasps/resource_grasp_A_03.yaml

matching:
  target_pairs: 100
  calibration_per_group: 20
  covariates:
    - ferrari_canny_epsilon
    - total_A_normal_force_N
    - A_translation_drift_m
    - A_rotation_drift_rad
    - minimum_joint_margin_rad

second_grasp:
  geometry_seed: 20260820
  calibration_seed: 20260821
  formal_seed: 20260822
  geometry_placements_per_region: 200
  calibration_B_seeds_per_state: 5
  formal_B_seeds_per_state: 20
  maximum_trajectory_candidates: 2048
